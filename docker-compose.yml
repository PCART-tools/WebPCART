version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: webpcart-backend
    ports:
      - "5000:5000"
    volumes:
      - backend_data:/app/backend/data
      - pcart_data:/app/pcart
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - webnet
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: webpcart-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - webnet
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
  pcart_data:
    driver: local

networks:
  webnet:
    driver: bridge